name: Cập nhật danh sách

on:
  schedule:
    - cron: "17 */6 * * *"   # 6 giờ một lần (giờ UTC)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/**", "config.json", ".github/workflows/update.yml"]

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tạo danh sách
        run: python scripts/build.py

      - name: Commit nếu có thay đổi
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vn.m3u vn-all.m3u
          if git diff --cached --quiet; then
            echo "Không có thay đổi."
          else
            git commit -m "Cập nhật danh sách $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
